name: Kurul Oturumu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  yargila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rastgele tost yargıla
        run: python3 tost_kurulu.py --rastgele --sahip "GitHub Actions" --makine "ubuntu-latest"
